# Publishes a GitHub Release with the packaged skills when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python tests/test_history_audit.py
      - name: Build dist/ and package
        run: python build.py --package "${GITHUB_REF_NAME}"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.zip --title "${GITHUB_REF_NAME}" --generate-notes
      - name: Upload zips (manual run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: skills
          path: release/*.zip
